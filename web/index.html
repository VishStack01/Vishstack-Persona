<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vishstack Persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F2; --surface:#FBFBF8; --surface-2:#EFEFEA; --ink:#171717; --ink-2:#55554F; --ink-3:#86867F;
  --line:#E6E6E0; --line-2:#D9D9D2; --accent:#B2E7FF; --accent-ink:#171717; --blue:#1890F0; --green:#306048;
  --red:#B3261E; --amber:#8A5A00; --amber-bg:#FBF1DC; --red-bg:#FBE9E7; --green-bg:#E6F0EA; --blue-bg:#E4F3FC;
  --dot-empty:#E2E2DC; --dot-pass:#D2D2CB; --dot-stop:#B2E7FF; --dot-watch:#1890F0; --dot-act:#306048;
  --font:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card:7px; --r-btn:8px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151514; --surface:#1D1D1B; --surface-2:#252523; --ink:#EDEDE7; --ink-2:#B6B6AE; --ink-3:#85857E;
    --line:#2E2E2B; --line-2:#3A3A36; --accent:#B2E7FF; --accent-ink:#171717; --blue:#4BA9F5; --green:#78B894;
    --red:#F0897F; --amber:#E2B45C; --amber-bg:#2E2614; --red-bg:#331B18; --green-bg:#18271F; --blue-bg:#14263A;
    --dot-empty:#2A2A27; --dot-pass:#3B3B37; --dot-stop:#B2E7FF; --dot-watch:#4BA9F5; --dot-act:#78B894;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151514; --surface:#1D1D1B; --surface-2:#252523; --ink:#EDEDE7; --ink-2:#B6B6AE; --ink-3:#85857E;
  --line:#2E2E2B; --line-2:#3A3A36; --accent:#B2E7FF; --accent-ink:#171717; --blue:#4BA9F5; --green:#78B894;
  --red:#F0897F; --amber:#E2B45C; --amber-bg:#2E2614; --red-bg:#331B18; --green-bg:#18271F; --blue-bg:#14263A;
  --dot-empty:#2A2A27; --dot-pass:#3B3B37; --dot-stop:#B2E7FF; --dot-watch:#4BA9F5; --dot-act:#78B894;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
a{color:var(--blue)}

/* Top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:16px; padding:14px 28px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.brand{font-size:20px; font-weight:500; letter-spacing:-0.01em; white-space:nowrap}
.brand span{color:var(--ink-3)}
.top .spacer{flex:1}
.save-state{font-size:13px; color:var(--ink-3); white-space:nowrap}

/* Shell */
.shell{display:grid; grid-template-columns:232px minmax(0,1fr); gap:32px; max-width:1240px; margin:0 auto; padding:28px}
.steps{position:sticky; top:84px; align-self:start; display:flex; flex-direction:column; gap:2px}
.step{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; border:0; border-radius:var(--r-btn); background:transparent; cursor:pointer; color:var(--ink-2)}
.step:hover{background:var(--surface-2)}
.step[aria-current="page"]{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}
.step .n{width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:12px; font-variant-numeric:tabular-nums; background:var(--surface-2); color:var(--ink-2); flex:none}
.step.done .n{background:var(--green-bg); color:var(--green)}
.step .lbl{flex:1}
.step .meta{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.steps .note{margin:16px 12px 0; font-size:12px; color:var(--ink-3); line-height:1.5}

main{min-width:0}
.view-head{max-width:720px; margin:6px 0 28px}
.view-head h1{font-size:35px; line-height:1.05; font-weight:400; letter-spacing:-0.02em; margin:0 0 12px}
.view-head p{font-size:16px; color:var(--ink-2); margin:0; max-width:64ch}
h2{font-size:20px; line-height:1.38; font-weight:500; margin:0 0 4px}
h3{font-size:15px; font-weight:600; margin:0}
.sub{color:var(--ink-2); margin:0 0 16px; max-width:70ch}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.section{margin-bottom:60px}

.card{background:var(--surface); border-radius:var(--r-card); box-shadow:inset 0 0 0 1px var(--line); padding:24px}
.card + .card{margin-top:16px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.stack{display:flex; flex-direction:column; gap:14px}

/* Forms */
label.f{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--ink-2); min-width:0}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%; padding:11px 12px; border:0; border-radius:var(--r-btn); background:var(--bg); box-shadow:inset 0 0 0 1px var(--line-2); color:var(--ink); font-size:15px}
textarea{min-height:120px; resize:vertical; line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none; box-shadow:inset 0 0 0 2px var(--blue)}
.check{display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--ink-2)}
.check input{margin-top:3px; accent-color:var(--blue)}
.chips-in{display:flex; flex-wrap:wrap; gap:8px}
.chips-in label{display:flex; gap:6px; align-items:center; padding:6px 10px; border-radius:999px; box-shadow:inset 0 0 0 1px var(--line-2); font-size:13px; cursor:pointer}
.chips-in input{accent-color:var(--blue)}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 22px; border:0; border-radius:var(--r-btn); cursor:pointer; font-size:15px; font-weight:500; background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line-2); white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); color:var(--accent-ink); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, #000 10%)}
.btn.primary:hover{background:color-mix(in srgb, var(--accent) 85%, #fff)}
.btn.dark{background:var(--ink); color:var(--bg); box-shadow:none}
.btn.small{height:34px; padding:0 14px; font-size:13px}
.btn.ghost{background:transparent; box-shadow:none; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.linkbtn{border:0; background:none; padding:0; color:var(--blue); cursor:pointer; font-size:13px}

/* Badges */
.badge{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:500; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.badge.ok{background:var(--green-bg); color:var(--green)}
.badge.warn{background:var(--amber-bg); color:var(--amber)}
.badge.bad{background:var(--red-bg); color:var(--red)}
.badge.info{background:var(--blue-bg); color:var(--blue)}
.ev{display:inline-block; padding:1px 6px; border-radius:5px; background:var(--surface-2); color:var(--ink-2); font-size:12px; font-variant-numeric:tabular-nums; cursor:help; margin:0 2px 2px 0}

/* Persona field: the signature element */
.field-card{padding:28px}
.field{display:grid; grid-template-columns:repeat(40,minmax(0,1fr)); gap:3px; max-width:760px}
.field i{display:block; aspect-ratio:1; border-radius:2px; background:var(--dot-empty); transition:background-color .5s ease}
.field i.pass{background:var(--dot-pass)}
.field i.stop{background:var(--dot-stop)}
.field i.watch{background:var(--dot-watch)}
.field i.act{background:var(--dot-act)}
@media (prefers-reduced-motion:reduce){.field i{transition:none!important}}
.field-cap{margin-top:16px; color:var(--ink-2); font-size:14px}
.legend{display:flex; flex-wrap:wrap; gap:16px; margin-top:14px; font-size:13px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend b{width:10px; height:10px; border-radius:2px; display:inline-block}
.field-wrap{display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:32px; align-items:start}
.stat-col{display:flex; flex-direction:column; gap:18px}
.stat .v{font-size:35px; line-height:1; font-weight:400; letter-spacing:-0.02em; font-variant-numeric:tabular-nums}
.stat .l{font-size:13px; color:var(--ink-2); margin-top:4px}

/* Lists and tables */
.list{display:flex; flex-direction:column}
.list .item{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.list .item .txt{flex:1; min-width:0; overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-weight:500; color:var(--ink-3); font-size:12px; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums}
tr.win td{background:var(--blue-bg)}

/* Variant */
.variant .hook{font-size:20px; line-height:1.38; margin:10px 0 14px}
.variant dl{display:grid; grid-template-columns:110px minmax(0,1fr); gap:8px 16px; margin:0; font-size:14px}
.variant dt{color:var(--ink-3)}
.variant dd{margin:0; overflow-wrap:anywhere}
.beats{margin:0; padding:0; list-style:none}
.beats li{display:flex; gap:10px}
.beats .t{color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:52px}
.vhead{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.vhead .id{font-weight:600}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.claim{padding:12px 0; border-top:1px solid var(--line)}
.claim:first-child{border-top:0}
.quote{margin-top:6px; padding-left:10px; border-left:2px solid var(--line-2); color:var(--ink-2); font-size:13px}
.seg{border-top:1px solid var(--line); padding:18px 0}
.seg:first-of-type{border-top:0; padding-top:0}
.seg .traits{margin:10px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; font-size:14px}
.seg .traits .ty{color:var(--ink-3); display:inline-block; min-width:72px}
.share{width:84px}
.empty{padding:28px; text-align:left; color:var(--ink-2); border-radius:var(--r-card); box-shadow:inset 0 0 0 1px var(--line); background:var(--surface)}
.empty h3{margin-bottom:6px; color:var(--ink)}
.notice{padding:12px 14px; border-radius:var(--r-btn); background:var(--amber-bg); color:var(--amber); font-size:14px; margin-bottom:16px}
.notice.info{background:var(--blue-bg); color:var(--blue)}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px}
.tabs button{height:34px; padding:0 14px; border-radius:var(--r-btn); border:0; background:transparent; box-shadow:inset 0 0 0 1px var(--line-2); cursor:pointer; font-size:13px; color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--ink); color:var(--bg); box-shadow:none}
details summary{cursor:pointer; color:var(--ink-2); font-size:14px}
.score{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-bottom:16px}

/* Busy bar and toast */
.busy{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:40; display:flex; align-items:center; gap:14px; padding:10px 10px 10px 18px; border-radius:12px; background:var(--ink); color:var(--bg); box-shadow:0 8px 30px rgba(0,0,0,.18); max-width:calc(100% - 32px)}
.busy .spin{width:14px; height:14px; border-radius:50%; border:2px solid color-mix(in srgb, var(--bg) 35%, transparent); border-top-color:var(--bg); animation:sp 0.9s linear infinite; flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.busy .spin{animation:none}}
.busy .btn{height:32px; padding:0 12px; font-size:13px; background:transparent; color:var(--bg); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--bg) 40%, transparent)}
.toast{position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:41; max-width:380px; padding:12px 16px; border-radius:var(--r-btn); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-2), 0 8px 24px rgba(0,0,0,.12); font-size:14px}
.toast.bad{color:var(--red)}
[hidden]{display:none!important}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr); padding:16px; gap:16px}
  .steps{position:static; flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:4px}
  .step{width:auto; flex:none}
  .step .meta{display:none}
  .steps .note{display:none}
  .top{padding:12px 16px}
  .grid2,.field-wrap,.score{grid-template-columns:minmax(0,1fr)}
  .view-head h1{font-size:28px}
  .card{padding:18px}
  .variant dl{grid-template-columns:minmax(0,1fr)}
  .field{gap:2px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Vishstack <span>Persona</span></div>
  <div class="spacer"></div>
  <div class="save-state" id="usage" hidden></div>
  <div class="save-state" id="saveState">Loading workspace</div>
  <button class="btn small ghost" data-action="export">Export</button>
</header>
<div class="shell">
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="busy" id="busy" hidden role="status" aria-live="polite"><span class="spin"></span><span id="busyText">Working</span><button class="btn" data-action="stop">Stop</button></div>
<div class="toast" id="toast" hidden role="alert"></div>

<script>
"use strict";
/* ---------- State ---------- */
const KEYS = ["core","evidence","references","facts","variants","posts"];
const MIN_EVIDENCE = 3;
const MAX_LOOPS = 3;
const SEG_TINTS = ["#9CC9E0","#B9CBA6","#D9C49E","#C6B7DA","#A6C9C3","#DDB6AE","#BEC5CF","#D6D0A0"];

function fresh(){
  return {
    core:{ segments:[], unassigned:[], patterns:[], gaps:[], brief:{goal:"download", platform:"Instagram Reels", format:"Talking head", topic:"", offer:"", language:"Hinglish", targets:[], count:3}, panel:null, metric:"hold", n:{E:1,G:1,T:1,R:1,M:1,F:1,V:1,P:1} },
    evidence:{ items:[] }, references:{ items:[] }, facts:{ items:[] }, variants:{ items:[] }, posts:{ items:[] }
  };
}
const S = { backend:null, search:null, writerModel:null, ws: fresh(), view:"audience", db:null, uid:null, sample:null, downloads:null, mode:"local", dirty:new Set(), saving:false, ctl:null, panelTab:null, showAllEv:false };
const nid = (p) => p + (S.ws.core.n[p]++);

/* ---------- Helpers ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (sel, root=document) => root.querySelector(sel);
const pct = (x) => Math.round(x) + "%";
const clamp = (x) => Math.max(0, Math.min(100, Number(x) || 0));
const norm = (s) => String(s||"").toLowerCase().replace(/[“”"‘’'`]/g,"").replace(/[^\p{L}\p{N}%.\s]/gu," ").replace(/\s+/g," ").trim();
function hash01(i, salt){ let h = 2166136261 ^ i; for (const c of String(salt)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } h ^= h >>> 13; h = Math.imul(h, 2246822507); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function stripPII(t){
  return String(t)
    .replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, "[email removed]")
    .replace(/(?:\+?\d[\d\s-]{8,}\d)/g, "[number removed]")
    .replace(/(^|\s)@[\w.]{2,30}/g, "$1[handle removed]")
    .trim();
}
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 5200); }
function errCopy(e){
  const c = e && e.code;
  if (c === "not_granted") return "Claude isn't allowed on this page yet. Allow it when asked, then try again.";
  if (c === "rate_limited") return "Too many requests at once. Wait a minute, then try again.";
  if (c === "invalid_json") return "The answer couldn't be read. Try again, or use less data at once.";
  if (c === "cancelled") return "Stopped.";
  if (c === "unavailable") return "AI steps only run inside Claude. Open this page from claude.ai.";
  return (e && e.message) ? e.message : "Something went wrong. Try again.";
}
const segById = (id) => S.ws.core.segments.find(g => g.id === id);
const evById = (id) => S.ws.evidence.items.find(e => e.id === id);
const factById = (id) => S.ws.facts.items.find(f => f.id === id);
const varById = (id) => S.ws.variants.items.find(v => v.id === id);
const activeSegs = () => S.ws.core.segments.filter(g => !g.low && g.share > 0);

/* ---------- Storage ---------- */
function markDirty(...keys){ keys.forEach(k => S.dirty.add(k)); clearTimeout(markDirty._t); markDirty._t = setTimeout(flush, 700); setSave("Saving"); }
async function flush(){
  if (S.saving) { markDirty._t = setTimeout(flush, 500); return; }
  S.saving = true;
  try {
    for (const k of [...S.dirty]) {
      S.dirty.delete(k);
      const body = { v: S.ws[k] };
      const size = new Blob([JSON.stringify(body)]).size;
      if (size > 240000) { toast(`The ${k} data is too large to save (${Math.round(size/1024)} KB). Remove some items.`, true); continue; }
      if (S.mode === "server") { const r = await fetch(`/api/workspace/${k}`, { method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) }); if (!r.ok) throw new Error("server refused the save"); }
      else if (S.mode === "db") await S.db.doc(`data/users/${S.uid}/${k}`).set(body);
      else { try { localStorage.setItem("vsp:" + k, JSON.stringify(body)); } catch(_) {} }
    }
    setSave(S.mode === "server" ? "Saved on your server" : S.mode === "db" ? "Saved to your Claude account" : "Saved in this browser");
  } catch (e) {
    setSave("Not saved"); toast("Couldn't save: " + (e.message || e.code || "unknown error"), true);
  } finally { S.saving = false; }
}
function setSave(t){ $("#saveState").textContent = t; }
function loadLocal(){
  const ws = fresh(); let any = false;
  for (const k of KEYS) { try { const raw = localStorage.getItem("vsp:" + k); if (raw) { const v = JSON.parse(raw).v; if (v) { ws[k] = Object.assign(ws[k], v); any = true; } } } catch(_) {} }
  ws.core.n = Object.assign(fresh().core.n, ws.core.n || {});
  ws.core.brief = Object.assign(fresh().core.brief, ws.core.brief || {});
  return { ws, any };
}
async function boot(){
  const local = loadLocal(); S.ws = local.ws; render();
  setSave("Saved in this browser");
  if (!window.claude && location.protocol.startsWith("http")) {
    try {
      const r = await fetch("/api/models");
      if (r.ok) {
        S.backend = await r.json(); S.mode = "server"; refreshUsage();
        S.writerModel = S.backend.roles.writer || S.backend.roles.default || null;
        const all = await (await fetch("/api/workspace")).json();
        const ws = fresh(); let any = false;
        for (const k of KEYS) if (all[k]) { ws[k] = Object.assign(ws[k], all[k]); any = true; }
        ws.core.n = Object.assign(fresh().core.n, ws.core.n || {});
        ws.core.brief = Object.assign(fresh().core.brief, ws.core.brief || {});
        if (any) S.ws = ws; else if (local.any) markDirty(...KEYS);
        setSave("Saved on your server"); render(); return;
      }
    } catch (_) {}
  }
  if (!(window.claude && typeof window.claude.use === "function")) { setSave("Saved in this browser"); return; }
  const safe = (p) => p.then(x => x).catch(() => null);
  const [db, user, sample, downloads] = await Promise.all([safe(claude.use("db")), safe(claude.use("user")), safe(claude.use("sample")), safe(claude.use("downloads"))]);
  S.sample = sample; S.downloads = downloads;
  if (db && user) {
    try {
      const uid = await user.id();
      if (uid) {
        S.db = db; S.uid = uid; S.mode = "db";
        const ws = fresh(); let any = false;
        for (const k of KEYS) { const snap = await db.doc(`data/users/${uid}/${k}`).get(); if (snap.exists && snap.data().v) { ws[k] = Object.assign(ws[k], snap.data().v); any = true; } }
        ws.core.n = Object.assign(fresh().core.n, ws.core.n || {});
        ws.core.brief = Object.assign(fresh().core.brief, ws.core.brief || {});
        if (any) S.ws = ws; else if (local.any) markDirty(...KEYS);
        setSave("Saved to your Claude account");
      }

async function ask(prompt, label, tier, model){
  if (S.backend) return askServer(prompt, label, tier, model);
  if (!S.sample) throw { code:"unavailable" };
  if (prompt.length > 240000) throw { message:"Too much data for one request. Remove some items and try again." };
  S.ctl = new AbortController();
  $("#busyText").textContent = label + ". This can take up to a minute.";
  $("#busy").hidden = false;
  try { return await S.sample.json(prompt, { modelTier: tier || "default", signal: S.ctl.signal }); }
  finally { $("#busy").hidden = true; S.ctl = null; }
}
async function askServer(prompt, label, tier, model){
  S.ctl = new AbortController();
  $("#busyText").textContent = label + (model ? ` with ${model}` : "") + ". This can take up to a minute.";
  $("#busy").hidden = false;
  try {
    const r = await fetch("/api/ask", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ prompt, tier: tier || "default", model: model || null }), signal: S.ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { message: j.detail || `Server error ${r.status}` };
    S.lastModel = j.model; return j.data;
  } catch (e) { if (e && e.name === "AbortError") throw { code:"cancelled" }; throw e; }
  finally { $("#busy").hidden = true; S.ctl = null; refreshUsage(); }
}
async function refreshUsage(){
  if (!S.backend) return;
  try { const u = await (await fetch("/api/usage")).json(); const el = $("#usage"); el.hidden = false; el.textContent = `${u.calls_24h} of ${u.cap} model calls today`; } catch(_) {}
}
async function api(path, body, label){
  $("#busyText").textContent = label; $("#busy").hidden = false; S.ctl = new AbortController();
  try {
    const r = await fetch(path, body instanceof FormData ? { method:"POST", body, signal:S.ctl.signal } : { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{}), signal:S.ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { message: j.detail || `Server error ${r.status}` };
    return j;
  } catch (e) { if (e && e.name === "AbortError") throw { code:"cancelled" }; throw e; }

}

/* ---------- Personas ---------- */
function allocate(){
  const segs = activeSegs(); const out = new Array(1000).fill(null);
  if (!segs.length) return out;
  const total = segs.reduce((a,g) => a + g.share, 0) || 1;
  const raw = segs.map(g => ({ g, x: g.share / total * 1000 }));
  raw.forEach(r => r.n = Math.floor(r.x));
  let left = 1000 - raw.reduce((a,r) => a + r.n, 0);
  [...raw].sort((a,b) => (b.x - b.n) - (a.x - a.n)).forEach(r => { if (left > 0) { r.n++; left--; } });
  let i = 0; raw.forEach(r => { for (let k = 0; k < r.n; k++) out[i++] = r.g.id; });
  return out;
}
function personaStates(variantId, which){
  const run = S.ws.core.panel; const alloc = allocate();
  return alloc.map((gid, i) => {
    if (!gid) return "";
    if (!run || !variantId) return "seg:" + gid;
    const res = (which === "second" && run.second ? run.second : run.results);
    const r = res[gid] && res[gid][variantId];
    if (!r || !r.grounded) return "none";
    const u = hash01(i, variantId + gid);
    const s = r.stop/100, w = r.watch/100, a = r.act/100;
    if (u < s*w*a) return "act"; if (u < s*w) return "watch"; if (u < s) return "stop"; return "pass";
  });
}
function fieldHTML(states, animate){
  const segIdx = {}; S.ws.core.segments.forEach((g,i) => segIdx[g.id] = i);
  let html = "";
  states.forEach((st, i) => {
    if (st.startsWith("seg:")) { const c = SEG_TINTS[segIdx[st.slice(4)] % SEG_TINTS.length]; html += `<i style="background:${c}"></i>`; }
    else if (animate && st) html += `<i data-s="${st}" style="transition-delay:${Math.round(i*1.1)}ms"></i>`;
    else html += `<i class="${st}"></i>`;
  });
  return `<div class="field" role="img" aria-label="Grid of 1,000 personas">${html}</div>`;
}
function aggregate(variantId, which){
  const run = S.ws.core.panel; if (!run) return null;
  const res = which === "second" && run.second ? run.second : run.results;
  const segs = activeSegs(); const total = segs.reduce((a,g) => a + g.share, 0) || 1;
  let stop=0, watch=0, act=0, trust=0, tw=0, grounded=0, missing=0;
  segs.forEach(g => {
    const r = res[g.id] && res[g.id][variantId]; const w = g.share / total;
    if (!r || !r.grounded) { missing++; return; }
    grounded++;
    stop += w * r.stop/100; watch += w * (r.stop/100)*(r.watch/100); act += w * (r.stop/100)*(r.watch/100)*(r.act/100); trust += w * r.trust; tw += w;
  });
  return { stop: stop*1000, watch: watch*1000, act: act*1000, trust: tw ? trust/tw : 0, grounded, missing };
}
function goalMetric(a){ const g = S.ws.core.brief.goal; return g === "reach" ? a.stop : g === "watch" ? a.watch : a.act; }
function goalLabel(){ const g = S.ws.core.brief.goal; return g === "reach" ? "stopped" : g === "watch" ? "watched to the end" : "acted"; }

function scoreboard(){
  const m = S.ws.core.metric; const ps = S.ws.posts.items.filter(p => p.actual && p.actual.views > 0 && (m !== "engagement" || p.actual.likes != null) && (m !== "hold" || p.actual.hold > 0));
  const real = (p) => ({ hold: p.actual.hold, actions: p.actual.actions / p.actual.views, views: p.actual.views, engagement: ((p.actual.likes||0) + (p.actual.comments||0)) / p.actual.views })[m];
  const pred = (p) => ({ hold: p.predicted.stop, actions: p.predicted.act, views: p.predicted.stop, engagement: p.predicted.watch })[m];
  let pairs=0, panel=0, gutPairs=0, gut=0;
  for (let i=0;i<ps.length;i++) for (let j=i+1;j<ps.length;j++){
    const d = real(ps[i]) - real(ps[j]); if (!d) continue;
    const dp = pred(ps[i]) - pred(ps[j]); if (dp) { pairs++; if (Math.sign(dp) === Math.sign(d)) panel++; }
    const dg = ps[i].gut - ps[j].gut; if (dg) { gutPairs++; if (Math.sign(dg) === Math.sign(d)) gut++; }
  }
  return { pairs, panel, gutPairs, gut, n: ps.length };
}

        const evIds = (s.evidence_ids||[]).filter(id => ids.has(id) && !taken.has(id)); evIds.forEach(id => taken.add(id));
        const traits = (s.traits||[]).map(t => ({ type: String(t.type||"trait"), text: String(t.text||""), evidenceIds: (t.evidence_ids||[]).filter(id => ids.has(id)) }))

        return { name: String(s.name||"Unnamed group"), description: String(s.description||""), awareness: String(s.awareness||"unknown"), language: String(s.language||"not clear from evidence"), evidenceIds: evIds, traits };
      }).filter(s => s.evidenceIds.length && s.traits.length);

async function truthCheck(list){
  list = list.filter(Boolean); if (!list.length) return;
  for (const v of list) {
    const prompt = `You are a strict fact checker. ${UNTRUSTED}
Check the content below against the fact library ONLY. Never use outside knowledge to mark a claim supported.

For every factual claim (numbers, statistics, prices, rates, outcomes, comparisons, statements about laws, products, companies or people):
- "supported": a library entry directly states it. Give source_id and evidence_quote, an exact word-for-word excerpt of that entry (at most 25 words).
- "contradicted": a library entry says otherwise. Give source_id and evidence_quote.
- "unverifiable": the library doesn't settle it, even if you believe it's true.
Statements clearly framed as personal opinion or experience get kind "opinion" and verdict "opinion".
Also flag honesty problems: hook_not_delivered (the hook promises something the script never delivers), false_urgency, guarantee (promising results), fake_social_proof (testimonials, quotes or user numbers not in the library).

Reply with only JSON:
{"claims":[{"text":"...","kind":"fact","verdict":"supported","source_id":"F1","evidence_quote":"...","note":"..."}],"flags":[{"type":"guarantee","text":"the exact words","note":"..."}]}

Fact library:
${factBlock()}

Content:
${contentBlock(v)}`;
    try {
      const out = await ask(prompt, `Checking ${v.id}`);
      const claims = (out.claims||[]).map(c => {
        const x = { text:String(c.text||""), verdict:String(c.verdict||"unverifiable"), sourceId: c.source_id || "", quote: String(c.evidence_quote||""), note: String(c.note||"") };
        if (x.verdict === "supported" || x.verdict === "contradicted") {
          const f = factById(x.sourceId);
          if (!f || !x.quote || !norm(f.text).includes(norm(x.quote))) { x.verdict = "unverifiable"; x.note = "The quoted evidence wasn't found word for word in your fact library, so this claim isn't counted as checked."; x.quote = ""; }
        }
        if (!["supported","contradicted","unverifiable","opinion"].includes(x.verdict)) x.verdict = "unverifiable";
        return x;
      });
      const all = contentBlock(v);
      const unknownTags = [...new Set([...all.matchAll(/\[(F\d+)\]/g)].map(m => m[1]))].filter(id => !factById(id));
      const LBL = { hook_not_delivered:"Hook not delivered", false_urgency:"False urgency", guarantee:"Promises results", fake_social_proof:"Unbacked social proof" };
      const flags = (out.flags||[]).map(f => ({ type:String(f.type||"other"), label: LBL[f.type] || "Honesty issue", text:String(f.text||""), note:String(f.note||"") }));
      unknownTags.forEach(id => flags.push({ type:"unknown_tag", label:"Unknown source tag", text:id, note:"This tag isn't in your fact library." }));
      const status = claims.some(c => c.verdict === "contradicted") ? "blocked" : (claims.some(c => c.verdict === "unverifiable") || flags.length) ? "needs-fix" : "passed";
      v.gate = { status, claims, flags, at: Date.now() };
      markDirty("variants");
    } catch(e){ if (S.auto) throw e; toast(errCopy(e), true); break; }
  }
  if (!S.auto && S.view !== "truth") S.view = "truth";
  render();
}

async function panel(second, only){
  const run = S.ws.core.panel;
  let ids;
  if (only) ids = only;
  else if (second) ids = run.variantIds.filter(id => varById(id) && varById(id).gate.status === "passed");
  else ids = [...document.querySelectorAll("[data-test]")].filter(x => x.checked).map(x => x.dataset.test);
  if (!ids.length) return toast("Choose at least one version that passed the truth check.", true);
  const vs = ids.map(varById); const segs = activeSegs(); const b = S.ws.core.brief;
  const prompt = `Simulate how audience segments react to competing pieces of content while scrolling ${b.platform}. This ranks versions; it is not a forecast of exact numbers. ${UNTRUSTED}

Each segment is defined ONLY by its evidence-backed traits, with ids. Decide as a typical member of that segment would, based only on those traits.

${S.backend && S.backend.learned ? `Guidance learned from this creator's real post results (apply it):\n${S.backend.learned}\n\n` : ""}Be realistic and skeptical: most people scroll past most content. Give high stop rates only to hooks that directly hit a listed pain, goal or trigger of that segment, in their language. Penalise jargon, vague promises and anything that triggers a listed objection. Compare the versions side by side, so differences between them are meaningful.

For EACH segment and EACH version, give:
- stop: % of this segment who stop scrolling in the first 2 seconds (0-100)
- watch: % of those who stopped who watch to the end (0-100)
- trust: how much they'd believe it (0-100)
- act: % of those who watched who take the call to action (0-100)
- reason: one or two sentences in first person, in the segment's own language style
- objection: the main doubt left, or ""
- trait_ids: ids of that segment's traits that drove the reaction (at least one)

Segments:
${segBlock(segs)}

Versions:
${vs.map(contentBlock).join("\n\n")}

Reply with only JSON:
{"results":[{"segment_id":"G1","reactions":[{"variant_id":"V1","stop":0,"watch":0,"trust":0,"act":0,"reason":"...","objection":"...","trait_ids":["T1"]}]}]}`;
  try {
    const out = await ask(prompt, second ? "Getting a second opinion" : `Showing ${ids.length} version${ids.length>1?"s":""} to your panel`, second ? (S.backend ? "second_opinion" : "complex") : "default");
    const usedModel = S.backend ? S.lastModel : null;
    const res = {};
    (out.results||[]).forEach(sr => {
      const g = segById(sr.segment_id); if (!g || g.low) return;
      const tids = new Set(g.traits.map(t => t.id));
      res[g.id] = res[g.id] || {};
      (sr.reactions||[]).forEach(r => {
        if (!ids.includes(r.variant_id)) return;
        const traitIds = (r.trait_ids||[]).filter(t => tids.has(t));
        res[g.id][r.variant_id] = { stop: clamp(r.stop), watch: clamp(r.watch), trust: clamp(r.trust), act: clamp(r.act), reason: String(r.reason||""), objection: String(r.objection||""), traitIds, grounded: traitIds.length > 0 };
      });
    });
    if (second) {
      run.second = res; run.secondModel = usedModel;
      const pick = (which) => { let best=-1, w=null; ids.forEach(id => { const a = aggregate(id, which); if (a && goalMetric(a) > best) { best = goalMetric(a); w = id; } }); return w; };
      const a = pick("first"), c = pick("second"); run.agree = a === c ? a : null; S.panelWhich = "second";
    } else {
      S.ws.core.panel = { at: Date.now(), variantIds: ids, results: res, second: null, agree: null, model: usedModel }; S.panelWhich = "first";
    }
    markDirty("core"); S.animateField = true; if (!S.auto) S.view = "panel"; render();
  } catch(e){ if (S.auto) throw e; toast(errCopy(e), true); }
}

/* ---------- Autopilot: brief to tested, refined winner in one click ---------- */
function winnerOf(ids, which){ let best = -1, w = null; ids.forEach(id => { const a = aggregate(id, which); if (a && goalMetric(a) > best) { best = goalMetric(a); w = id; } }); return w; }
async function autopilot(){
  const b = readBrief();
  if (!b.topic) return toast("Describe the topic first.", true);
  if (!activeSegs().length) return toast("Build your audience segments first (step 1).", true);
  S.auto = { steps: [], done: false };
  const step = (t) => { S.auto.steps.push({ t, s: "run", note: "" }); render(); };
  const ok = (note) => { const st = S.auto.steps[S.auto.steps.length - 1]; st.s = "ok"; st.note = note || ""; render(); };
  let final = null;
  try {
    step("Write versions for your segments");
    const ids = await A.write(); if (!ids || !ids.length) throw { message: "No usable versions came back." };
    ok(`${ids.length} versions written`);

    step("Truth check every claim against your fact library");
    await truthCheck(ids.map(varById));
    let passed = ids.filter(id => varById(id).gate.status === "passed");
    const failing = ids.filter(id => varById(id).gate.status !== "passed");
    ok(`${passed.length} passed, ${failing.length} need fixes`);

    if (failing.length) {
      step("Fix unsupported claims and honesty problems");
      for (const id of failing) { const fixed = await A.fixV(id); if (fixed && varById(fixed).gate.status === "passed") passed.push(fixed); }
      ok(`${passed.length} versions ready for the panel`);
    }
    if (!passed.length) throw { message: "No version passed the truth check. Open Truth check to see which claims need a source." };

    step(`Show ${passed.length} versions to your 1,000 personas`);
    await panel(false, passed);
    let lead = winnerOf(passed, "first");
    ok(`${lead} leads on personas who ${goalLabel()}`);

    step("Get a second opinion from another model");
    await panel(true);
    ok(S.ws.core.panel.agree ? `Both agree: ${S.ws.core.panel.agree} leads` : "They disagree, so treat the ranking as uncertain");

    const l = leak(lead, "first"); const lv = varById(lead);
    if (l && (lv.loop || 0) < MAX_LOOPS) {
      step(`Refine ${lead} where it loses the most people`);
      const r = await A.refine(lead, "first");
      await truthCheck([varById(r)]);
      if (varById(r).gate.status !== "passed") { const f = await A.fixV(r); if (f && varById(f).gate.status === "passed") passed.push(f); }
      else passed.push(r);
      ok(`${l.seg.name} was losing most at ${({stop:"the hook", watch:"the middle", act:"the call to action"})[l.stage]}`);

      step("Test the refined version against the others");
      await panel(false, passed);
      lead = winnerOf(passed, "first");
      ok(`${lead} leads`);
    }
    final = lead;
    S.auto.done = true; S.auto.winner = final;
    toast(`Autopilot finished. ${final} leads. Review it, then lock the prediction before you post.`);
    S.panelTab = final; S.panelWhich = "first"; const keep = S.auto; S.auto = null; S.lastAuto = keep;
    S.view = "panel"; S.animateField = true; render(); window.scrollTo(0, 0);
  } catch (e) {
    const st = S.auto.steps[S.auto.steps.length - 1]; if (st) { st.s = "fail"; st.note = errCopy(e); }
    S.lastAuto = S.auto; S.auto = null; render();
  }
}
function autoHTML(){
  const a = S.auto || S.lastAuto; if (!a) return "";
  const badge = (st) => st.s === "ok" ? `<span class="badge ok">Done</span>` : st.s === "fail" ? `<span class="badge bad">Stopped</span>` : `<span class="badge info">Working</span>`;
  return `<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2>Autopilot</h2>${!S.auto ? `<button class="linkbtn" data-action="clearAuto">Hide</button>` : ""}</div>
    <div class="list" style="margin-top:8px">${a.steps.map(st => `<div class="item"><div class="txt">${esc(st.t)}${st.note ? `<div class="small muted">${esc(st.note)}</div>` : ""}</div>${badge(st)}</div>`).join("")}</div>
    <p class="small muted" style="margin:12px 0 0">Autopilot follows the same rules as you: nothing reaches the panel without passing the truth check, refining stops after ${MAX_LOOPS} loops, and nothing is posted. You review and approve.</p></div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]"); if (go) { S.view = go.dataset.go; render(); $("#view").focus({preventScroll:true}); window.scrollTo(0,0); return; }
  const tab = e.target.closest("[data-tab]"); if (tab) { S.panelTab = tab.dataset.tab; render(); return; }
  const wh = e.target.closest("[data-which]:not([data-action])"); if (wh) { S.panelWhich = wh.dataset.which; render(); return; }
  const a = e.target.closest("[data-action]"); if (!a) return;
  const fn = A[a.dataset.action]; if (!fn) return;
  if (a.dataset.action === "refine") fn(a.dataset.id, a.dataset.which); else fn(a.dataset.id);
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.share) { const g = segById(t.dataset.share); g.share = Math.max(0, Math.min(100, Number(t.value)||0)); const tot = activeSegs().reduce((a,x)=>a+x.share,0); if (tot) activeSegs().forEach(x => x.share = x.share/tot*100); markDirty("core"); render(); }
  if (t.id === "writerModel") { S.writerModel = t.value; return; }
  if (t.id === "metric") { S.ws.core.metric = t.value; markDirty("core"); render(); }
  if (t.id === "videoFile" && t.files[0]) { const f = t.files[0]; const fd = new FormData(); fd.append("file", f);
    api("/api/analyze-video", fd, "Analysing the video on your machine. Long videos take a few minutes").then(j => {
      const pace = [j.duration_seconds ? `${j.duration_seconds}s long` : "", `${j.cuts} cuts`, j.avg_shot_seconds ? `${j.avg_shot_seconds}s per shot` : "", j.words_per_minute ? `${j.words_per_minute} words per minute` : ""].filter(Boolean).join(", ");
      addRefItem("reel", `${f.name}: ${pace}`, `Hook (first 3 seconds): ${j.hook_text || "no speech"}\n${j.transcript}`);
      toast("Video analysed and added to your references."); render();
    }).catch(e => toast(errCopy(e), true)); t.value = ""; return; }
  if (t.id === "mediaFile" && t.files[0]) { const fd = new FormData(); fd.append("file", t.files[0]);
    api("/api/transcribe", fd, "Transcribing locally. Long recordings take a few minutes").then(j => { $("#evText").value = j.text; DRAFT.evText = j.text; $("#evType").value = "interview"; toast("Transcript loaded for review. Remove anything personal, confirm permission, then add."); }).catch(e => toast(errCopy(e), true)); t.value = ""; return; }
  if (t.id === "evFile" && t.files[0]) { const f = t.files[0]; if (f.size > 2_000_000) return toast("That file is over 2 MB. Split it into smaller files.", true);
    f.text().then(txt => { const lines = txt.split(/\r?\n/).map(l => l.includes(",") && /\.csv$/i.test(f.name) ? (l.match(/"([^"]{3,})"/)||[])[1] || l.split(",").sort((a,b)=>b.length-a.length)[0] : l).filter(Boolean); $("#evText").value = lines.join("\n"); DRAFT.evText = $("#evText").value; $("#evFileName").textContent = `${lines.length} lines loaded from ${f.name}. Review them, then add.`; }); }
  if (["bGoal","bPlatform","bFormat","bLang","bCount","bTopic","bOffer"].includes(t.id) || t.dataset.target) readBrief();
});
boot();
</script>
